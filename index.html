<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Image Gallery</h1>
    <p>Click any image to open lightbox • Use filters to sort</p>
  </header>

  <!-- Category Filters -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="food">Food</button>
    <button class="filter-btn" data-filter="travel">Travel</button>
    <button class="filter-btn" data-filter="life">Life</button>
    <button class="filter-btn" data-filter="nature">Nature</button>
  </div>

  <!-- Gallery Grid -->
  <div class="gallery" id="gallery">

    <!-- Food -->
    <div class="gallery-item" data-category="food">
      <img src="./food.jpg" alt="Delicious food" loading="lazy">
      <div class="overlay">Food</div>
    </div>

    <!-- Travel -->
    <div class="gallery-item" data-category="travel">
      <img src="./India Gate.jpg" alt="India Gate" loading="lazy">
      <div class="overlay">India Gate</div>
    </div>

    <div class="gallery-item" data-category="travel">
      <img src="./travel.jpg" alt="Travel" loading="lazy">
      <div class="overlay">Travel</div>
    </div>

    <!-- Life -->
    <div class="gallery-item" data-category="life">
      <img src="./life thought.jpg" alt="Life Thought" loading="lazy">
      <div class="overlay">Life Thought</div>
    </div>

    <div class="gallery-item" data-category="life">
      <img src="./new day new chance.jpg" alt="New Day New Chance" loading="lazy">
      <div class="overlay">New Day New Chance</div>
    </div>

    <!-- Nature -->
    <div class="gallery-item" data-category="nature">
      <img src="./mountain.jpg" alt="Mountain" loading="lazy">
      <div class="overlay">Mountain</div>
    </div>

    <div class="gallery-item" data-category="nature">
      <img src="./wonderfull images.jpg" alt="Wonderful Images" loading="lazy">
      <div class="overlay">Wonderful Images</div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
